<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1.54寸墨水屏模拟</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #333; color: #ddd; font-family: system-ui, sans-serif; }
  main { text-align: center; }
  .screen {
    width: 200px; height: 200px; margin-bottom: 12px;
    background: #f7f6f1; color: #17181a;
    box-shadow: 0 0 0 4px #222, 0 8px 24px #0008;
    padding: 10px 12px; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: space-between;
    filter: grayscale(1) contrast(1.12);
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: 18px; line-height: 1.1; letter-spacing: 1px; }
  .logo { width: 24px; height: 24px; flex: 0 0 auto; filter: grayscale(1) contrast(1.15); }
  .updated { font-size: 10px; color: #555; margin-top: 2px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; margin-top: 8px; }
  .value { font-variant-numeric: tabular-nums; font-weight: 700; }
  .bar { height: 7px; margin-top: 4px; background: #d9d8d2; }
  .bar > i { display: block; height: 100%; background: #17181a; }
  footer { font-size: 12px; color: #aaa; }
</style>
<main>
  <section class="screen" id="screen" aria-label="Coding Plan 额度">
    <header>
      <div>
        <h1>Coding Plan</h1>
        <div class="updated" id="updated">更新 11:16</div>
      </div>
      <svg class="logo" viewBox="0 0 24 24" aria-label="火山方舟" role="img">
        <path d="M12 3.2c1.8 2.3 3.9 4.1 4.6 6.3.5 1.6.2 3-.6 4.3 1.1-.4 2-1.1 2.6-2.2 1.1 2.6.1 5.7-2.4 7.3-3 2-7.2 1.4-9.4-1.4-2-2.5-1.7-6.2.6-8.4.4 1.2 1.3 2 2.5 2.4-.8-2.6.1-5.5 2.1-8.3z" fill="#17181a"/>
      </svg>
    </header>
    <div>
      <div class="row"><span>5小时</span><span class="value" id="five">7.75%</span></div>
      <div class="bar"><i id="fiveBar" style="width:7.75%"></i></div>
      <div class="row"><span>一周</span><span class="value" id="week">1.22%</span></div>
      <div class="bar"><i id="weekBar" style="width:1.22%"></i></div>
      <div class="row"><span>一月</span><span class="value" id="month">5.79%</span></div>
      <div class="bar"><i id="monthBar" style="width:5.79%"></i></div>
    </div>
    <footer id="reset">5小时 12分后重置</footer>
  </section>
  <footer>200 × 200 模拟预览</footer>
</main>
